name: g1-stage0-binding

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Gate status lives in docs/quality/G1-STAGE0-BINDING.md; update it only from real run output.
jobs:
  # G1 Stage-0 exit, binding scope (FACTORY §3, rubric R5): fails when evidence bound
  # to a wrong or omitted app/build version, or to a wrong, omitted or stale Kane run
  # id, yields a verified receipt, a validated workflow or a promotion. Kept in its
  # own workflow so it does not touch tests.yml (G8, and G1 exit in #27).
  g1-stage0-binding:
    name: G1 Stage-0 version+Kane binding
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[test]'
      - run: python scripts/g1-stage0-binding.py
