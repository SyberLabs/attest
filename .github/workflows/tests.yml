name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # demo/flask.md runs `pip install Flask`, so pip must be on PATH next to the test interpreter
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest
